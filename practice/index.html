<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini User Manager</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
      background: #111827;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
      color: #22c55e;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      padding: 10px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .users {
      margin-top: 20px;
    }

    .user {
      background: #1f2937;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete {
      background: #ef4444;
      color: white;
      padding: 5px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
    }

    .delete:hover {
      background: #dc2626;
    }

    .note {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>User Manager</h1>

    <!-- FORM (BACKEND TARGET: /submit) -->
    <form action="/submit" method="POST">
      <input type="text" name="name" placeholder="Enter name" required />
      <input type="email" name="email" placeholder="Enter email" required />
      <input type="password" name="password" placeholder="Enter password" required />

      <button type="submit">Add User</button>
    </form>

    <p class="note">Backend will handle storage (no database)</p>

    <!-- USERS SECTION (YOU WILL RENDER FROM BACKEND) -->
    <div class="users">
      <!-- Example UI (backend will generate this dynamically) -->

      <!--
      <div class="user">
        <span>John Doe - john@email.com</span>
        <a class="delete" href="/delete?id=1">Delete</a>
      </div>
      -->

    </div>
  </div>

</html>
